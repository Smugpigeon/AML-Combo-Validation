{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg border border-slate-200">
  <h1 class="text-2xl font-semibold brand mb-6">Log in</h1>
  {% if error %}
    <div class="mb-4 bg-red-50 border border-red-300 text-red-800 px-4 py-2 rounded text-sm">
      {{ error }}
    </div>
  {% endif %}
  <form method="post" action="/auth/login-form" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <button class="w-full bg-brand text-white py-2 rounded font-medium hover:opacity-90">
      Log in
    </button>
  </form>
  <p class="mt-4 text-sm text-slate-600">
    No account? <a href="/signup" class="brand hover:underline">Create one</a>
  </p>
</div>
{% endblock %}
