{% extends "base.html" %}
{% block title %}{{ t("nav.login") }}{% endblock %}

{% block content %}
<div class="hero-gradient min-h-[80vh] flex items-center py-12">
  <div class="max-w-md mx-auto w-full px-4 sm:px-6">

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 sm:p-10">
      <div class="text-center mb-6">
        <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-white flex items-center justify-center text-xl shadow-sm">
          👋
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">{{ t("login.title") }}</h1>
        <p class="text-sm text-slate-600">{{ t("login.subtitle") }}</p>
      </div>

      {% if error %}
        <div class="mb-5 bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded-lg text-sm">
          {{ t("login.error_invalid") }}
        </div>
      {% endif %}

      <form method="post" action="/auth/login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">{{ t("login.email") }}</label>
          <input type="email" name="email" required autofocus
                 class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 outline-none transition"
                 placeholder="you@university.edu">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">{{ t("login.password") }}</label>
          <input type="password" name="password" required
                 class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 outline-none transition"
                 placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full mt-2 px-5 py-3 bg-gradient-to-r from-brand-600 to-brand-700 text-white rounded-lg font-semibold shadow-md hover:shadow-lg hover:brightness-105 transition text-base">
          {{ t("login.submit") }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-600">
        {{ t("login.no_account") }}
        <a href="/signup" class="font-medium text-brand-700 hover:underline">{{ t("login.signup_link") }}</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
