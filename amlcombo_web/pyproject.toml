[project]
name = "amlcombo_web"
version = "0.2.0"
description = "Web service for the AML Combo-Prediction Kit (amlcombo.org)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    # Auth + crypto
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Queue
    "celery>=5.4",
    "redis>=5.2",
    # HTTP client (for LLM BYOK calls)
    "httpx>=0.28",
    # Pydantic (FastAPI dep, pinned for stability)
    "pydantic[email]>=2.10",
    # The kit itself — installed from the parent repo via pip install -e ../
    "combo_val",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",  # TestClient needs this
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
